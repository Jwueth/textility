<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" aria-labelledby="lecon-title lecon-desc" lang="fr" xml:lang="fr">
<title id="lecon-title">D&#x27;une observation à une pratique améliorée</title><desc id="lecon-desc">Un résultat réellement observé est examiné. Une preuve insuffisante conduit à ne rien ajouter. Une règle existante peut être réutilisée sans doublon ; un manque ou une clarification motive une règle candidate. L&#x27;accord et le mandat permettent une intégration contrôlée, ou un refus/différé. Un usage réel permet ensuite d&#x27;observer l&#x27;effet. La règle intégrée n&#x27;est pas pour autant éprouvée.</desc>
<defs><marker id="lecon-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#242926" stroke-width="2"/></marker><marker id="lecon-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9c422c" stroke-width="2"/></marker><marker id="lecon-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#62665c" stroke-width="2"/></marker></defs>
<style>text{font-family:system-ui,sans-serif}path,line,rect,polygon,circle{vector-effect:non-scaling-stroke}.edge{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1100" height="800" fill="#f4f1e9"/>
<text x="50" y="48" text-anchor="start" font-size="28" font-weight="600" fill="#242926" data-max-width="1000">De l’expérience à la pratique améliorée</text>
<text x="50" y="80" text-anchor="start" font-size="20" font-weight="400" fill="#62665c" data-max-width="1000">Une leçon n’est acquise ni par son récit, ni par son seul enregistrement.</text>
<g data-step="1">
<rect x="70" y="145" width="190" height="90" rx="2" fill="#fffdf7" stroke="#242926" stroke-width="2" data-node="observation"/>
<text x="165.0" y="183.5" text-anchor="middle" font-size="20" font-weight="600" fill="#242926" data-max-width="166">Observation</text>
<text x="165.0" y="210.5" text-anchor="middle" font-size="20" font-weight="400" fill="#242926" data-max-width="166">Preuve à lire</text>
</g>
<g data-step="2">
<path class="edge" d="M260 190 L365 190" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[260, 190], [365, 190]]" data-source="observation" data-target="existing"/>
<text x="312" y="168" text-anchor="middle" font-size="18" font-weight="400" fill="#242926" data-max-width="100">Étayé</text>
</g>
<g data-step="2">
<polygon points="365,190 435,130 505,190 435,250" fill="#fffdf7" stroke="#9c422c" stroke-width="2.5" data-node="existing" data-kind="diamond"/>
</g>
<g data-step="2">
<text x="435" y="113" text-anchor="middle" font-size="21" font-weight="600" fill="#242926" data-max-width="300">Règle déjà présente ?</text>
</g>
<g data-step="3">
<path class="edge" d="M505 190 L700 190" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[505, 190], [700, 190]]" data-source="existing" data-target="reuse"/>
<text x="600" y="167" text-anchor="middle" font-size="19" font-weight="400" fill="#242926" data-max-width="120">Oui</text>
</g>
<g data-step="3">
<rect x="700" y="145" width="280" height="90" rx="2" fill="#fffdf7" stroke="#242926" stroke-width="2" data-node="reuse"/>
<text x="840.0" y="183.5" text-anchor="middle" font-size="20" font-weight="600" fill="#242926" data-max-width="256">Réutiliser la règle</text>
<text x="840.0" y="210.5" text-anchor="middle" font-size="20" font-weight="400" fill="#242926" data-max-width="256">Sans ajout</text>
</g>
<g data-step="3">
<path class="edge" d="M435 250 L435 330" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[435, 250], [435, 330]]" data-source="existing" data-target="candidate"/>
<text x="468" y="270" text-anchor="start" font-size="18" font-weight="400" fill="#242926" data-max-width="240">Non / à préciser</text>
</g>
<g data-step="3">
<rect x="340" y="330" width="190" height="90" rx="2" fill="#fffdf7" stroke="#242926" stroke-width="2" data-node="candidate"/>
<text x="435.0" y="355.0" text-anchor="middle" font-size="20" font-weight="600" fill="#242926" data-max-width="166">Règle</text>
<text x="435.0" y="382.0" text-anchor="middle" font-size="20" font-weight="400" fill="#242926" data-max-width="166">candidate</text>
<text x="435.0" y="409.0" text-anchor="middle" font-size="20" font-weight="400" fill="#242926" data-max-width="166">Portée et limites</text>
</g>
<g data-step="4">
<path class="edge" d="M530 375 L570 375" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[530, 375], [570, 375]]" data-source="candidate" data-target="approval"/>
</g>
<g data-step="4">
<polygon points="570,375 620,325 670,375 620,425" fill="#fffdf7" stroke="#9c422c" stroke-width="2.5" data-node="approval" data-kind="diamond"/>
</g>
<g data-step="4">
<text x="620" y="295" text-anchor="middle" font-size="20" font-weight="600" fill="#242926" data-max-width="240">Accord et mandat</text>
<path class="edge" d="M670 375 L780 375" stroke="#9c422c" stroke-width="2.5" marker-end="url(#lecon-rust)" data-route="[[670, 375], [780, 375]]" data-source="approval" data-target="integrated"/>
<text x="724" y="354" text-anchor="middle" font-size="18" font-weight="400" fill="#9c422c" data-max-width="105">Intégrer</text>
</g>
<g data-step="4">
<rect x="780" y="330" width="230" height="90" rx="2" fill="#242926" stroke="#242926" stroke-width="2" data-node="integrated"/>
<text x="895.0" y="368.5" text-anchor="middle" font-size="20" font-weight="600" fill="#fffdf7" data-max-width="206">Règle intégrée</text>
<text x="895.0" y="395.5" text-anchor="middle" font-size="20" font-weight="400" fill="#fffdf7" data-max-width="206">Texte contrôlé</text>
</g>
<g data-step="4">
<text x="895" y="309" text-anchor="middle" font-size="19" font-weight="400" fill="#242926" data-max-width="245">Destination retenue</text>
</g>
<g data-step="2">
<path class="edge" d="M165 235 L165 515 L280 515" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[165, 235], [165, 515], [280, 515]]" data-source="observation" data-target="no-add"/>
<text x="190" y="328" text-anchor="start" font-size="18" font-weight="400" fill="#242926" data-max-width="250">Preuve insuffisante</text>
</g>
<g data-step="4">
<path class="edge" d="M620 425 L620 515 L490 515" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[620, 425], [620, 515], [490, 515]]" data-source="approval" data-target="no-add"/>
<text x="648" y="491" text-anchor="start" font-size="18" font-weight="400" fill="#242926" data-max-width="240">Écarter / différer</text>
</g>
<g data-step="2">
<rect x="280" y="480" width="210" height="70" rx="2" fill="#fffdf7" stroke="#242926" stroke-width="2" data-node="no-add"/>
<text x="385.0" y="522.0" text-anchor="middle" font-size="20" font-weight="600" fill="#242926" data-max-width="186">Pas d’ajout</text>
</g>
<g data-step="5">
<path class="edge" d="M895 420 L895 600" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[895, 420], [895, 600]]" data-source="integrated" data-target="usage"/>
<text x="920" y="548" text-anchor="start" font-size="18" font-weight="400" fill="#242926" data-max-width="165">À éprouver</text>
<path class="edge" d="M840 235 L840 270 L1060 270 L1060 645 L1010 645" stroke="#242926" stroke-width="2.5" marker-end="url(#lecon-ink)" data-route="[[840, 235], [840, 270], [1060, 270], [1060, 645], [1010, 645]]" data-source="reuse" data-target="usage"/>
</g>
<g data-step="5">
<rect x="780" y="600" width="230" height="90" rx="2" fill="#fffdf7" stroke="#242926" stroke-width="2" data-node="usage"/>
<text x="895.0" y="638.5" text-anchor="middle" font-size="20" font-weight="600" fill="#242926" data-max-width="206">Usage réel</text>
<text x="895.0" y="665.5" text-anchor="middle" font-size="20" font-weight="400" fill="#242926" data-max-width="206">Effet à observer</text>
</g>
<g data-step="6">
<path class="edge" d="M895 690 L895 735 L35 735 L35 190 L70 190" stroke="#9c422c" stroke-width="2.5" marker-end="url(#lecon-rust)" data-route="[[895, 690], [895, 735], [35, 735], [35, 190], [70, 190]]" data-source="usage" data-target="observation"/>
<text x="470" y="764" text-anchor="middle" font-size="20" font-weight="600" fill="#9c422c" data-max-width="760">Observer l’effet au prochain usage</text>
<text x="50" y="792" text-anchor="start" font-size="18" font-weight="400" fill="#62665c" data-max-width="1000">Intégrer une règle ne prouve pas son efficacité. Ne rien ajouter est aussi une sortie normale.</text>
</g>
</svg>