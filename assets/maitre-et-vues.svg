<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="maitre-title maitre-desc" lang="fr" xml:lang="fr">
<title id="maitre-title">Un maître, plusieurs vues de compréhension</title><desc id="maitre-desc">Une source désignée alimente un modèle de lecture puis plusieurs vues du même contenu. Le lecteur consulte ces vues, qui ne deviennent pas des maîtres concurrents. Un circuit d&#x27;édition distinct et facultatif passe par une écriture autorisée, des contrôles et une régénération. Ce dessin explique une méthode, pas une application ou un writer livré.</desc>
<defs><marker id="maitre-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#242926" stroke-width="2"/></marker><marker id="maitre-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9c422c" stroke-width="2"/></marker><marker id="maitre-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#62665c" stroke-width="2"/></marker></defs>
